[project]
name = "greetmcp"
version = "0.1.0"
description = "MCP server exposing the greet tool over streamable HTTP"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.2.1",
    "mcp-types>=2.3.0",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
