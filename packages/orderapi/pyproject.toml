[project]
name = "orderapi"
version = "0.1.0"
description = "Toy CRUD REST API over an SQLite orders table"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
