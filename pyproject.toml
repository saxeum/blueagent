[project]
name = "blueagent"
version = "0.1.0"
description = "Agent that drives an MCP server, plus the tools it talks to"
readme = "README.md"
authors = [
    { name = "zuchat", email = "62874892+gmtreacy@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.2.1",
    "greetmcp",
    "pydantic-ai-slim[mcp,openai]>=2.69.0",
    "python-dotenv>=1.2.4",
]

[tool.uv.sources]
greetmcp = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.isort]
known-first-party = ["blueagent", "greetmcp", "orderapi"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/orderapi/tests"]

[tool.basedpyright]
typeCheckingMode = "recommended"
