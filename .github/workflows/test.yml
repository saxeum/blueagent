name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: this repo enforces sha_pinning_required, and the
      # allowlist only admits github-owned actions plus astral-sh/setup-uv.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: install workspace
        run: uv sync --all-packages --frozen
      - name: ruff
        run: uv run ruff check src packages tests
      - name: basedpyright
        run: uv run basedpyright
      - name: pytest
        run: uv run pytest -q
